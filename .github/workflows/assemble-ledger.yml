name: Assemble AI Project Tracker

on:
  push:
    paths:
      - 'data/.frontier-delta-*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-ai-project-tracker
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge deltas into project snapshot
        run: node scripts/apply-frontier-deltas.mjs

      - name: Validate project snapshot
        run: npm run validate

      - name: Remove consumed delta inputs
        run: rm -f data/.frontier-delta-*.json data/.frontier-part-*

      - name: Build compact automation status from validated state
        run: npm run status:write

      - name: Validate compact automation status
        run: npm run status:validate

      - name: Commit validated snapshot, status, and delta cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frontier.json data/automation-status.json
          git add -u -- data
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
            exit 0
          fi
          git commit -m "Sync AI Project Tracker"
          git push
