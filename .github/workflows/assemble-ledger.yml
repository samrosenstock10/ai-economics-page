name: Assemble AI Economic Reality Ledger

on:
  push:
    paths:
      - 'data/.ledger-delta-*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-ledger
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge deltas into ledger
        run: node scripts/apply-ledger-deltas.mjs

      - name: Validate ledger
        run: npm run validate

      - name: Commit validated ledger and clean deltas
        shell: bash
        run: |
          rm -f data/.ledger-delta-*.json data/.ledger-part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json
          git add -u -- data
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "Sync AI economic reality ledger"
          git push
