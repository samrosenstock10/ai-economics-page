name: Verify AI Frontier Ledger

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'data/frontier.json'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'data/frontier.json'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Validate frontier snapshot
        run: npm run validate
