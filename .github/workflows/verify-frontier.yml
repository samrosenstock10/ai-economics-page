name: Verify AI Frontier Ledger

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'data/frontier.json'
      - 'data/automation-status.json'
      - 'tests/**'
      - 'docs/automation/**'
      - 'vercel.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'package.json'
      - 'lib/**'
      - 'scripts/**'
      - 'data/frontier.json'
      - 'data/automation-status.json'
      - 'tests/**'
      - 'docs/automation/**'
      - 'vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Validate frontier snapshot
        run: npm run validate
      - name: Regenerate deterministic automation status
        run: npm run status:write
      - name: Validate automation status against frontier and pending deltas
        run: npm run status:validate
      - name: Require committed status to match regenerated status
        run: git diff --exit-code -- data/automation-status.json
